        tags: [fixture, wet_area, fall_risk_high]
      - id: vanity_sink
        kind: vanity_sink
        position: [1.35, 2.40]
        rotation_z_deg: 0.0
        tags: [fixture, wet_area]
      - id: mirror
        kind: mirror
        position: [1.35, 2.63]
        rotation_z_deg: 0.0
        elevation_m: 1.15
        tags: [fixture]
      - id: bathtub
        kind: bathtub
        position: [1.90, 1.25]
