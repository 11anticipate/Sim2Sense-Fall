    furniture:
      - id: bed
        kind: bed
        position: [0.65, 1.30]
        rotation_z_deg: 0.0
        size: [1.00, 1.95, 0.80]
        tags: [sleep, fall_risk_high]
      - id: nightstand
        kind: nightstand
        position: [1.45, 0.35]
        rotation_z_deg: 0.0
        tags: [storage]
      - id: desk
        kind: desk
        position: [2.20, 1.60]
