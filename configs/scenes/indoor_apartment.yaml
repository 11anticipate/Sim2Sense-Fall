# 典型中国城市住宅平面：两室一厅一厨一卫 + 入户走廊
#
# 原始平面为 8.4 m x 7.0 m；layout_scale_xy=2.20 后实际导出约 18.48 m x 15.40 m。
# Z 轴向上，单位为米。每个房间用左下角 origin 和 size 描述，
# 可以直接对照建筑平面图读数。
#
# 墙体归属约定：共享墙只由一侧房间生成，避免重复几何。
#   bedroom 生成 south/west/north/east（含 x=4.0 的内墙）
#   living_room 生成 south/north/east（跳过 west，由 bedroom 生成）
#   corridor 只生成两端外墙 west/east，南北两侧墙由相邻房间生成
#   bathroom 生成 south/north/west/east（含 x=2.4 的内墙）
#   kitchen 生成 south/north/east（跳过 west，由 bathroom 生成）
#   bedroom_2 生成 south/north/east（跳过 west，由 kitchen 生成）
#
# 开口 offset 从墙面的低坐标端起算（南北墙从 origin_x，东西墙从 origin_y）。

scene_id: apartment_cn_two_bedroom
description: >-
  两室一厅一厨一卫加走廊的典型室内场景，用于跌倒检测的无线信道仿真。
  包含木质与瓷砖地面、涂料隔墙、石膏吊顶，以及卧室、客厅、卫生间、厨房和
  次卧的成套家具。
frequency_hz: 2.4e+9   # YAML 1.1 的浮点指数必须带符号；写成 2.4e9 会被解析成字符串
seed: 20260921
# Horizontal layout scale applied consistently to rooms, openings and furniture.
# Heights remain unchanged so the apartment is slightly larger without becoming taller.
layout_scale_xy: 2.20
foundation: true
foundation_margin_m: 0.5
foundation_thickness_m: 0.30

# 材质覆盖示例：不写 materials 时全部使用 src/sim2sense_fall/scenes/materials.py 中的默认值。
# 这里的写法只覆盖列出的字段，其余字段沿用默认。
materials:
  tile_floor:
    # 卫生间瓷砖偏光滑，略微调低动态摩擦以体现湿滑风险。
    dynamic_friction: 0.35

rooms:
  - id: bedroom
    room_type: bedroom
    origin: [0.0, 0.0]
    size: [4.0, 3.0]
    wall_material: painted_drywall
    floor_material: wood_floor
    ceiling_material: gypsum_ceiling
    wall_height: 2.7
    wall_thickness: 0.12
    walls: [south, north, west, east]
    openings:
      - wall: north
        kind: door
        width: 0.90
        height: 2.05
        offset: 1.00
        leaf: false          # 通往走廊的敞开洞口
      - wall: south
        kind: window
        width: 1.60
        height: 1.30
        offset: 2.00
        sill_height: 0.90
    furniture:
      - id: bed
        kind: bed
        position: [1.40, 1.15]
        rotation_z_deg: 0.0
        tags: [sleep, fall_risk_high]
      - id: nightstand
        kind: nightstand
        position: [2.45, 0.35]
        rotation_z_deg: 0.0
        tags: [storage]
      - id: wardrobe
        kind: wardrobe
        position: [3.55, 2.20]
        rotation_z_deg: 90.0
        tags: [storage, tall]
      - id: rug
        kind: rug
        position: [2.55, 1.55]
        size: [1.80, 2.50, 0.012]
        rotation_z_deg: 0.0
        tags: [soft_surface, fall_risk_medium]
      - id: ceiling_lamp
        kind: ceiling_lamp
        position: [2.00, 1.50]
        rotation_z_deg: 0.0
        elevation_m: 2.54
        tags: [fixture]

  - id: living_room
    room_type: living_room
    origin: [4.0, 0.0]
    size: [4.4, 3.0]
    wall_material: painted_drywall
    floor_material: wood_floor
    ceiling_material: gypsum_ceiling
    wall_height: 2.7
    wall_thickness: 0.12
    walls: [south, north, east]
    openings:
      - wall: north
        kind: door
        width: 1.00
        height: 2.05
        offset: 3.20
        leaf: false
      - wall: south
        kind: window
        width: 2.00
        height: 1.40
        offset: 2.20
        sill_height: 0.85
    furniture:
      - id: sofa
        kind: sofa
        position: [1.30, 1.50]
        rotation_z_deg: 90.0
        tags: [seat, adl]
      - id: coffee_table
        kind: coffee_table
        position: [2.30, 1.50]
        rotation_z_deg: 0.0
        tags: [obstacle, sharp_edge]
      - id: armchair
        kind: armchair
        position: [2.35, 0.65]
        rotation_z_deg: 180.0
        tags: [seat]
      - id: tv_stand
        kind: tv_stand
        position: [4.05, 1.50]
        rotation_z_deg: 270.0
        tags: [storage]
      - id: tv
        kind: tv
        position: [4.00, 1.50]
        rotation_z_deg: 270.0
        elevation_m: 0.52
        tags: [fixture, obstacle]
      - id: rug
        kind: rug
        position: [2.60, 1.50]
        size: [2.00, 2.50, 0.012]
        rotation_z_deg: 0.0
        tags: [soft_surface]
      - id: ceiling_lamp
        kind: ceiling_lamp
        position: [2.20, 1.50]
        rotation_z_deg: 0.0
        elevation_m: 2.54
        tags: [fixture]

  - id: corridor
    room_type: corridor
    origin: [0.0, 3.0]
    size: [8.4, 1.2]
    wall_material: painted_drywall
    floor_material: tile_floor
    ceiling_material: gypsum_ceiling
    wall_height: 2.7
    wall_thickness: 0.12
    walls: [west, east]
    openings:
      - wall: east
        kind: door
        width: 1.00
        height: 2.10
        offset: 0.60
        leaf: true           # 入户门常闭
    furniture:
      - id: shoe_cabinet
        kind: shoe_cabinet
        position: [6.60, 0.30]
        rotation_z_deg: 0.0
        tags: [storage, entrance]
      - id: coat_rack
        kind: coat_rack
        position: [7.60, 0.35]
        rotation_z_deg: 0.0
        tags: [entrance]
      - id: rug
        kind: rug
        position: [7.50, 0.60]
        size: [1.40, 0.80, 0.012]
        rotation_z_deg: 0.0
        tags: [soft_surface, entrance]
      - id: ceiling_lamp
        kind: ceiling_lamp
        position: [4.20, 0.60]
        rotation_z_deg: 0.0
        elevation_m: 2.54
        tags: [fixture]

