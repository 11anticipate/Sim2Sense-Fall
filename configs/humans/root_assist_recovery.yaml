# Pelvis actuator profile while the body is recovering from the floor
# (getting_up / standing_up). Rationale: with the get-up root height now derived by
# contact closure, the recovery still measured 0.78 body weight of *upward* assist
# against 0.23 carried by the floor, i.e. the wire still does most of the work and
# the lowest skinned point stayed 41 mm off the ground at p95. This profile halves
# the declared lift so the limbs must carry the load. It is blended in over the
# controller's transition time (root_control.blend_assist_configs), never switched.
# A/B evidence: docs/getup-float-2026-09-27.md.
position_stiffness_n_m: 12000.0
position_damping_ns_m: 900.0
rotation_stiffness_nm_rad: 3000.0
rotation_damping_nms_rad: 180.0
max_force_n: 1500.0
max_torque_nm: 400.0
gravity_compensation_fraction: 0.45
max_vertical_lift_fraction_of_weight: 0.55
