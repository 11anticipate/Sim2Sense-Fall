  max_no_support_s: 0.05
  slip_speed_m_s: 0.15
  skin_penetration_m: 0.005
  joint_error_deg: 15.0
  min_contact_impulse_ns: 0.01
  floor_z_m: 0.0
record_mesh_at_physics_hz: true
contact_planner:
  cycle_distance_m: 0.6
  stance_fraction: 0.62
  clearance_m: 0.03
  swing_shape: quintic
  root_bob: true
# Mocap-derived pelvis feedforward; see keyboard.yaml 2026-09-25 对照专项.
reference_feedforward_scale: 1.0
