# 训练前 ADL 扩量批量包 train03（2026-09-27）。
# 由 scripts/humans/make_dataset_configs.py --batch train03 --print-plan \
#       --max-sessions 23 \
#       --only fall_standing,fall_forward,adl_long_patrol,adl_patrol_mid,adl_long_stand,adl_bend_hold
#   生成；会话配置须先由该脚本产出（spawn 必须来自净空审计，行走需求必须被实测 run 长度覆盖）。
# 目的：train02 只准入 210 s ADL 信道材料，误报率的分母不足以引用；本批把 ADL 仿真时长
#   提到 739 s（预计准入 ~628 s），并用 4 类长时 ADL（长巡走/中巡走/久站/弯腰保持）
#   压每小时误报这一指标。摔倒只保留 100% 过门的 standing/forward 两类作正样本对照。
# 展开并执行：
#   PYTHONPATH=src python3 scripts/sionna/batch_generate.py \
#     --plan configs/sionna/batch_train03.yaml --out artifacts/batches/train03
#   bash scripts/sionna/run_batch_loop.sh configs/sionna/batch_train03.yaml artifacts/batches/train03 12
description: 'train03: 23 会话，spawn x 触发情境 x 朝向矩阵，只含当前过门的活动'
trials: []
sessions:
- config: configs/humans/dataset/train03/01_fall_standing_sp040_bedroom.yaml
  name: 01_fall_standing_sp040_bedroom
