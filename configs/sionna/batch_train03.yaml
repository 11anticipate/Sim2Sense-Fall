rt_target_hz: 120
rt_frames: 24
rt_seed_base: 20260927
render_frames: false
# 120 Hz mesh costs ~10 MB of recording plus ~20 MB of segment export per simulated second:
# 805 s of train03 protocol is ~24 GB, more than the free space on this disk. Each accepted
# RT trace therefore deletes its own segment mesh (re-derivable from recording.npz on CPU),
# the plan is executed in 3 contiguous session chunks, and no pass starts below 6 GB free.
prune_mesh_after_import: true
min_free_gb: 6
split_label: train03_grouped_by_session_pending_splits_json

